name: Blog & LinkedIn Automation Cron

on:
  schedule:
    # Runs every 15 minutes (GitHub Actions schedules are in UTC; your app converts to Africa/Lagos WAT)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual testing from the GitHub Actions tab

jobs:
  trigger-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/blog-automation
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTFOLIO_URL }}/api/cron/blog-automation")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP Status: $status"
          echo "Response: $body"
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
